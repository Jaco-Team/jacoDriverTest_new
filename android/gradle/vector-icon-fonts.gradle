import javax.inject.Inject
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.FileSystemOperations
import org.gradle.api.provider.ListProperty
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.InputDirectory
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.TaskAction

/** Copies the selected fonts with a tracked asset dependency for every variant. */
abstract class CopyVectorIconFonts extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getFontsDirectory()

    @Input
    abstract ListProperty<String> getFontNames()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @Inject
    abstract FileSystemOperations getFileSystemOperations()

    @TaskAction
    void copyFonts() {
        fileSystemOperations.sync {
            from(fontsDirectory) {
                include(fontNames.get())
            }
            into(outputDirectory.dir('fonts'))
        }
    }
}

def iconConfig = project.ext.vectoricons
def copyFonts = tasks.register('copyReactNativeVectorIconFonts', CopyVectorIconFonts) {
    fontsDirectory.set(file(iconConfig.iconFontsDir ?: '../../node_modules/react-native-vector-icons/Fonts'))
    fontNames.set(iconConfig.iconFontNames ?: ['*.ttf'])
    outputDirectory.set(layout.buildDirectory.dir('generated/vectorIconFonts'))
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.sources.assets.addGeneratedSourceDirectory(copyFonts) { it.outputDirectory }
}
