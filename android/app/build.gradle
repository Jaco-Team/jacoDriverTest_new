apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

apply from: new File(["node", "--print", "require.resolve('@sentry/react-native/package.json')"].execute().text.trim(), "../sentry.gradle")
android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.jacodrivertest"

    defaultConfig {
        applicationId "com.jacodrivertest"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 93
        versionName "80.13"
        manifestPlaceholders = [ appAuthRedirectScheme: "jaco" ]

        ndk { abiFilters "arm64-v8a", "x86_64" }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {

    implementation("com.facebook.react:react-android")
    implementation("androidx.core:core-splashscreen:1.0.1")

    constraints {
        implementation("com.yandex.android:maps.mobile:4.42.0-full") {
            because("yamap-plus 6.10.1 требует MapKit 4.42; 16 KB page size есть в 4.19+")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

subprojects {
    configurations.configureEach {
        resolutionStrategy {
            force "com.yandex.android:maps.mobile:4.42.0-full"
            eachDependency { details ->
                if (details.requested.group == "com.yandex.android" &&
                        details.requested.name == "maps.mobile") {
                    details.useVersion("4.42.0-full")
                }
            }
        }
    }
}
