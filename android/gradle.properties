# Project-wide Gradle settings
# JDK path is machine-local: set org.gradle.java.home in ~/.gradle/gradle.properties
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true

# React Native flags
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# Only 64-bit ABIs
reactNativeArchitectures=arm64-v8a,x86_64

# NDK r28+ (16 KB support)
# android.ndkVersion=28.0.12433566
android.ndkVersion=29.0.14206865

# AsyncStorage's bundled KSP lookup predates Kotlin 2.4; avoid its legacy fallback.
AsyncStorage_kspVersion=2.3.12

# Use AGP 9's Kotlin and public Android DSL across app and library modules.
android.builtInKotlin=true
android.newDsl=true
