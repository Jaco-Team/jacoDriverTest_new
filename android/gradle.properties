# Project-wide Gradle settings
# JDK path is machine-local: set org.gradle.java.home in ~/.gradle/gradle.properties
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true

# React Native flags
newArchEnabled=true
hermesEnabled=true

# Only 64-bit ABIs
reactNativeArchitectures=arm64-v8a,x86_64

# NDK r28+ (16 KB support)
# android.ndkVersion=28.0.12433566
android.ndkVersion=29.0.14206865

# Opt out of built-in kotlin and new DSL behavior that ships with AGP 9.
# Starting from AGP 10.x these opt outs will be removed.
android.builtInKotlin=false
android.newDsl=false
