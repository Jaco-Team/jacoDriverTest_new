buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion     = 26
        compileSdkVersion = 36
        targetSdkVersion  = 36
        ndkVersion        = "29.0.14206865"
        kotlinVersion     = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:8.13.1')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"

def deleteFinderDuplicateBuildFiles = { Project project ->
  def buildDirFile = project.layout.buildDirectory.asFile.get()

  if (!buildDirFile.exists()) {
    return
  }

  project.fileTree(buildDirFile) {
    include "**/* 2.*"
  }.files.each { duplicateFile ->
    if (!duplicateFile.delete()) {
      logger.warn("Could not delete duplicate generated file: ${duplicateFile}")
    }
  }
}

subprojects {
  configurations.configureEach {
    resolutionStrategy {
      force 'com.yandex.android:maps.mobile:4.42.0-full'
      force 'com.google.android.gms:play-services-location:21.0.1'
    }
  }

  tasks.configureEach { task ->
    if (task.name.matches(/compile.*JavaWithJavac/) || task.name.matches(/compile.*Kotlin/)) {
      task.doFirst {
        deleteFinderDuplicateBuildFiles(project)
      }
    }
  }
}
